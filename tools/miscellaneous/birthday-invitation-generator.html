    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;1,400&family=Montserrat:wght@300;400;500;600&family=Orbitron:wght@400;600;700&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* ─── Page Layout ─── */
        .big-wrapper {
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 2rem;
            align-items: start;
        }
        @media (max-width: 900px) {
            .big-wrapper { grid-template-columns: 1fr; }
            .preview-panel { position: static; }
        }

        /* ─── Form Panel ─── */
        .form-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
        }
        .section-label {
            font-size: .7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: .6rem;
            display: block;
        }

        /* ─── Theme Thumbnails ─── */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 1rem;
        }
        .theme-thumb {
            border-radius: 10px;
            padding: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all .2s;
        }
        .theme-thumb:hover { transform: translateY(-2px); }
        .theme-thumb.active { border-color: #00c8ff; box-shadow: 0 0 0 3px rgba(0,200,255,.2); }
        .theme-thumb-inner {
            height: 68px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .62rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .th-elegant  { background: linear-gradient(135deg,#fffbf0,#f5e6c8); color: #8B6914; }
        .th-fun      { background: linear-gradient(135deg,#ff9fd2,#ffcf6e); color: #9c1a5c; }
        .th-modern   { background: linear-gradient(135deg,#1a1a2e,#16213e); color: #00c8ff; }
        .th-vintage  { background: linear-gradient(135deg,#f3e4d0,#d9bfa0); color: #6b3a2a; }
        .th-celestial{ background: linear-gradient(135deg,#0d0221,#2d1b69); color: #c8a8ff; }
        .th-garden   { background: linear-gradient(135deg,#d4edda,#a8d5b5); color: #1a5c2e; }

        /* ─── Color Pills ─── */
        .color-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
        .color-pill {
            width: 26px; height: 26px; border-radius: 50%;
            cursor: pointer; border: 3px solid transparent;
            transition: transform .2s, border-color .2s;
            box-shadow: 0 1px 4px rgba(0,0,0,.3);
        }
        .color-pill:hover { transform: scale(1.2); }
        .color-pill.active { border-color: var(--text-primary); transform: scale(1.15); }

        /* ─── Form Fields ─── */
        .f-group { margin-bottom: .9rem; }
        .f-group label {
            font-size: .7rem; font-weight: 600;
            letter-spacing: .5px; text-transform: uppercase;
            color: var(--text-secondary); margin-bottom: 4px; display: block;
        }
        .f-group input, .f-group textarea {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 9px 13px;
            font-size: .9rem;
            width: 100%;
            transition: border-color .2s;
        }
        .f-group input:focus, .f-group textarea:focus {
            border-color: #00c8ff; outline: none;
            box-shadow: 0 0 0 3px rgba(0,200,255,.12);
        }
        .f-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .f-group textarea { resize: vertical; min-height: 80px; }

        /* ─── Generate Button ─── */
        .gen-btn {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #00c8ff, #a855f7);
            color: #fff; border: none; border-radius: 10px;
            font-size: .95rem; font-weight: 600; letter-spacing: 1px;
            cursor: pointer; transition: opacity .2s, transform .1s;
            margin-top: .5rem;
        }
        .gen-btn:hover { opacity: .88; }
        .gen-btn:active { transform: scale(.98); }

        /* ─── Preview Panel ─── */
        .preview-panel {
            position: sticky;
            top: 90px;
        }
        .preview-label {
            font-size: .7rem; letter-spacing: 3px;
            text-transform: uppercase; color: var(--text-secondary);
            margin-bottom: .8rem;
        }

        /* ─── Placeholder ─── */
        .inv-placeholder {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 420px;
            color: var(--text-secondary); text-align: center; gap: 1rem;
            border: 2px dashed var(--border-color); border-radius: 16px;
        }
        .inv-placeholder i { font-size: 3rem; opacity: .25; }
        .inv-placeholder p { font-size: .85rem; opacity: .55; margin: .3rem 0 0; }

        /* ─── Action Row ─── */
        .action-row {
            display: flex; gap: 8px; margin-top: .8rem; flex-wrap: wrap;
        }
        .act-btn {
            flex: 1; min-width: 90px; padding: 9px 10px;
            background: transparent; border: 1px solid var(--border-color);
            border-radius: 8px; color: var(--text-primary);
            font-size: .82rem; cursor: pointer; transition: all .2s;
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .act-btn:hover { border-color: #00c8ff; color: #00c8ff; }

        /* ─── Confetti Canvas ─── */
        #confettiCanvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 9999;
            display: none;
        }

        /* ════════════════════════════════════
           INVITATION CARD
        ════════════════════════════════════ */
        .inv-card-outer {
            position: relative;
            border-radius: 22px;
            padding: 3px;
            background: conic-gradient(from 0deg, #ffd700, #ff6b6b, #a855f7, #00c8ff, #ffd700);
            animation: borderSpin 5s linear infinite;
        }
        @keyframes borderSpin {
            to { filter: hue-rotate(360deg); }
        }

        .inv-card {
            border-radius: 20px;
            overflow: hidden;
            animation: cardReveal .8s cubic-bezier(.22,.68,0,1.2) both;
        }
        @keyframes cardReveal {
            from { opacity: 0; transform: scale(.88) translateY(24px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .inv-inner {
            position: relative;
            padding: 3rem 2.5rem;
            text-align: center;
            overflow: hidden;
        }

        /* ─── Floating particles ─── */
        .inv-p {
            position: absolute;
            border-radius: 50%;
            animation: floatUp linear infinite;
            pointer-events: none;
        }
        @keyframes floatUp {
            0%   { transform: translateY(110%) rotate(0deg);   opacity: 0; }
            10%  { opacity: .7; }
            90%  { opacity: .6; }
            100% { transform: translateY(-15%) rotate(720deg); opacity: 0; }
        }

        /* ─── Corner ornaments ─── */
        .inv-corner {
            position: absolute; font-size: 1.3rem; opacity: .5;
            animation: twinkle 2.5s ease-in-out infinite;
            line-height: 1;
        }
        .inv-corner.tl { top: 14px; left: 16px; }
        .inv-corner.tr { top: 14px; right: 16px; animation-delay: .6s; }
        .inv-corner.bl { bottom: 14px; left: 16px; animation-delay: 1.2s; }
        .inv-corner.br { bottom: 14px; right: 16px; animation-delay: 1.8s; }
        @keyframes twinkle {
            0%,100% { opacity: .25; transform: scale(.85); }
            50%      { opacity: .8;  transform: scale(1.15); }
        }

        /* ─── Typography ─── */
        .inv-eyebrow {
            font-family: 'Montserrat', sans-serif;
            font-size: .7rem; letter-spacing: 4px;
            text-transform: uppercase; opacity: .65;
            margin-bottom: 1rem;
        }
        .inv-divider {
            margin: .9rem auto; width: 90px; height: 1.5px; border-radius: 1px;
        }
        .inv-title {
            font-family: 'Great Vibes', cursive;
            font-size: 3.2rem; line-height: 1.1;
            margin: 0 0 .25rem;
        }
        .inv-title.font-orbitron { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; letter-spacing: 2px; }
        .inv-title.font-playfair { font-family: 'Playfair Display', serif; font-size: 2.6rem; }
        .inv-title.font-cormorant { font-family: 'Cormorant Garamond', serif; font-size: 3rem; font-style: italic; }

        .inv-tagline {
            font-family: 'Playfair Display', serif;
            font-style: italic; font-size: 1rem; opacity: .7;
            margin-bottom: 1.2rem;
        }
        .inv-host-label {
            font-family: 'Montserrat', sans-serif;
            font-size: .7rem; letter-spacing: 3px;
            text-transform: uppercase; opacity: .6; margin-bottom: .2rem;
        }
        .inv-host-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem;
        }

        .inv-details { display: flex; flex-direction: column; gap: .55rem; margin-bottom: 1.5rem; }
        .inv-detail-row {
            display: flex; align-items: center; justify-content: center; gap: .6rem;
            font-family: 'Montserrat', sans-serif; font-size: .88rem;
        }
        .inv-detail-icon {
            width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: .65rem; flex-shrink: 0; border: 1px solid;
        }

        .inv-message {
            font-family: 'Playfair Display', serif;
            font-style: italic; font-size: .95rem;
            line-height: 1.65; opacity: .85;
            margin: 1.2rem 0; padding: .9rem 1.4rem;
            border-radius: 8px; border-left: 3px solid;
        }

        .inv-rsvp-wrap {
            padding-top: 1rem;
        }
        .inv-rsvp-label {
            font-family: 'Montserrat', sans-serif;
            font-size: .65rem; letter-spacing: 3px;
            text-transform: uppercase; opacity: .55;
        }
        .inv-rsvp-value {
            font-family: 'Playfair Display', serif;
            font-size: 1rem; margin-top: .2rem;
        }

        /* ════════════════════════════════════
           THEMES
        ════════════════════════════════════ */

        /* Elegant */
        .theme-elegant .inv-inner { background: linear-gradient(160deg, #fffdf5 0%, #fff8e7 50%, #fef3d0 100%); color: #3d2b00; }
        .theme-elegant .inv-title { }
        .theme-elegant .inv-p { background: #D4AF37; }
        .theme-elegant .inv-corner { color: #D4AF37; }
        .theme-elegant .inv-message { background: rgba(212,175,55,.08); }

        /* Fun */
        .theme-fun .inv-inner { background: linear-gradient(160deg, #fff0f9 0%, #ffe4f3 50%, #fff9e6 100%); color: #4a1525; }
        .theme-fun .inv-p { background: #e91e8c; }
        .theme-fun .inv-corner { color: #e91e8c; }
        .theme-fun .inv-message { background: rgba(233,30,140,.07); }

        /* Modern */
        .theme-modern .inv-inner { background: radial-gradient(ellipse at 50% 0%, #1a1a3e 0%, #0f0f1a 60%, #060610 100%); color: #dde4ff; }
        .theme-modern .inv-p { background: #00c8ff; }
        .theme-modern .inv-corner { color: #00c8ff; }
        .theme-modern .inv-message { background: rgba(0,200,255,.07); }

        /* Vintage */
        .theme-vintage .inv-inner { background: linear-gradient(160deg, #faf3e6 0%, #f2e2c4 50%, #e8d0a8 100%); color: #4a2c0a; }
        .theme-vintage .inv-p { background: #7B3F00; }
        .theme-vintage .inv-corner { color: #7B3F00; }
        .theme-vintage .inv-message { background: rgba(123,63,0,.07); }

        /* Celestial */
        .theme-celestial .inv-inner { background: radial-gradient(ellipse at 50% 0%, #2d1b69 0%, #0d0221 70%, #000010 100%); color: #e8d8ff; }
        .theme-celestial .inv-p { background: #c8a8ff; }
        .theme-celestial .inv-corner { color: #c8a8ff; }
        .theme-celestial .inv-message { background: rgba(168,85,247,.1); }

        /* Garden */
        .theme-garden .inv-inner { background: linear-gradient(160deg, #f0faf3 0%, #ddf2e5 50%, #cce8d8 100%); color: #1a3d25; }
        .theme-garden .inv-p { background: #2d7a47; }
        .theme-garden .inv-corner { color: #2d7a47; }
        .theme-garden .inv-message { background: rgba(45,122,71,.07); }

        /* ─── Shimmer animation for title ─── */
        @keyframes shimmer {
            0%,100% { filter: brightness(1); }
            50%      { filter: brightness(1.25) drop-shadow(0 0 8px currentColor); }
        }
        .inv-title { animation: shimmer 3s ease-in-out infinite; }
    </style>
</head>

<script>
(function () {
    'use strict';

    // ── State ──
    let currentTheme = 'elegant';
    let accentColor  = '#D4AF37';

    const themeConfig = {
        elegant:  {
            eyebrow:  'You are cordially invited',
            tagline:  'A birthday celebration to remember',
            icons:    ['✦', '✦', '✦', '✦'],
            titleFont: '',
        },
        fun: {
            eyebrow:  "It's time to celebrate! 🎉",
            tagline:  'Join the fun and let the party begin',
            icons:    ['🎈', '🎉', '🎊', '🎂'],
            titleFont: 'font-playfair',
        },
        modern: {
            eyebrow:  'You are invited to join us',
            tagline:  'A contemporary celebration of life',
            icons:    ['◆', '◆', '◆', '◆'],
            titleFont: 'font-orbitron',
        },
        vintage: {
            eyebrow:  'The pleasure of your company is requested',
            tagline:  'An occasion steeped in warmth and nostalgia',
            icons:    ['❧', '❧', '❧', '❧'],
            titleFont: 'font-cormorant',
        },
        celestial: {
            eyebrow:  'Under the stars, we celebrate',
            tagline:  'A cosmic gathering of hearts',
            icons:    ['★', '✦', '★', '✦'],
            titleFont: '',
        },
        garden: {
            eyebrow:  'Amidst blooms and laughter',
            tagline:  'A garden party to delight the senses',
            icons:    ['✿', '✿', '✿', '✿'],
            titleFont: 'font-cormorant',
        },
    };

    // ── DOM refs ──
    const wrapper      = document.getElementById('invWrapper');
    const placeholder  = document.getElementById('invPlaceholder');
    const actionRow    = document.getElementById('actionRow');
    const generateBtn  = document.getElementById('generateBtn');
    const confettiCvs  = document.getElementById('confettiCanvas');
    const confettiCtx  = confettiCvs.getContext('2d');

    // ── Theme selection ──
    document.querySelectorAll('.theme-thumb').forEach(thumb => {
        thumb.addEventListener('click', function () {
            document.querySelectorAll('.theme-thumb').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            currentTheme = this.dataset.theme;
        });
    });

    // ── Color selection ──
    document.querySelectorAll('.color-pill').forEach(pill => {
        pill.addEventListener('click', function () {
            document.querySelectorAll('.color-pill').forEach(p => p.classList.remove('active'));
            this.classList.add('active');
            accentColor = this.dataset.color;
        });
    });

    // ── Helpers ──
    function fmtDate(d) {
        if (!d) return '';
        const [y, m, day] = d.split('-').map(Number);
        return new Date(y, m - 1, day).toLocaleDateString('en-GB', {
            weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        });
    }
    function fmtTime(t) {
        if (!t) return '';
        const [h, m] = t.split(':').map(Number);
        return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`;
    }
    function hex(c, a) {
        return c + Math.round(a * 255).toString(16).padStart(2, '0');
    }

    // ── Build invitation HTML ──
    function buildInvitation() {
        const name   = document.getElementById('eventName').value.trim();
        const host   = document.getElementById('hostName').value.trim();
        const date   = document.getElementById('eventDate').value;
        const time   = document.getElementById('eventTime').value;
        const venueV = document.getElementById('venue').value.trim();
        const msgV   = document.getElementById('message').value.trim();
        const rsvpC  = document.getElementById('rsvpContact').value.trim();
        const rsvpD  = document.getElementById('rsvpDate').value;

        const cfg   = themeConfig[currentTheme];
        const icons = cfg.icons;

        // Generate floating particles
        const particles = Array.from({ length: 14 }, (_, i) => {
            const sz = 4 + Math.random() * 5;
            const colors = [accentColor, '#fff', hex(accentColor, 0.6)];
            return `<div class="inv-p" style="
                left:${5 + Math.random() * 88}%;
                bottom:-8%;
                width:${sz}px; height:${sz}px;
                background:${colors[i % 3]};
                animation-duration:${4 + Math.random() * 5}s;
                animation-delay:${Math.random() * 5}s;
            "></div>`;
        }).join('');

        const acBg  = hex(accentColor, 0.13);
        const acBd  = accentColor;

        return `
        <div class="inv-card-outer">
          <div class="inv-card theme-${currentTheme}" id="invCard">
            <div class="inv-inner">
              <div class="inv-particles">${particles}</div>

              <div class="inv-corner tl">${icons[0]}</div>
              <div class="inv-corner tr">${icons[1]}</div>
              <div class="inv-corner bl">${icons[2]}</div>
              <div class="inv-corner br">${icons[3]}</div>

              <p class="inv-eyebrow">${cfg.eyebrow}</p>
              <div class="inv-divider" style="background:linear-gradient(90deg,transparent,${accentColor},transparent)"></div>

              <h1 class="inv-title ${cfg.titleFont}" style="color:${accentColor}">${name || 'Your Special Day'}</h1>
              <p class="inv-tagline">${cfg.tagline}</p>

              <div class="inv-divider" style="background:linear-gradient(90deg,transparent,${accentColor},transparent)"></div>

              ${host ? `
              <p class="inv-host-label">Hosted by</p>
              <p class="inv-host-name">${host}</p>
              ` : ''}

              <div class="inv-details">
                ${date ? `<div class="inv-detail-row">
                  <div class="inv-detail-icon" style="background:${acBg};color:${accentColor};border-color:${acBd}">
                    <i class="fas fa-calendar-day"></i>
                  </div>
                  <span>${fmtDate(date)}</span>
                </div>` : ''}
                ${time ? `<div class="inv-detail-row">
                  <div class="inv-detail-icon" style="background:${acBg};color:${accentColor};border-color:${acBd}">
                    <i class="fas fa-clock"></i>
                  </div>
                  <span>${fmtTime(time)}</span>
                </div>` : ''}
                ${venueV ? `<div class="inv-detail-row">
                  <div class="inv-detail-icon" style="background:${acBg};color:${accentColor};border-color:${acBd}">
                    <i class="fas fa-map-marker-alt"></i>
                  </div>
                  <span>${venueV}</span>
                </div>` : ''}
              </div>

              ${msgV ? `
              <div class="inv-message" style="background:${acBg};border-left-color:${accentColor}">
                &ldquo;${msgV}&rdquo;
              </div>` : ''}

              ${(rsvpC || rsvpD) ? `
              <div class="inv-divider" style="background:linear-gradient(90deg,transparent,${accentColor},transparent)"></div>
              <div class="inv-rsvp-wrap">
                <p class="inv-rsvp-label">RSVP${rsvpD ? ' by ' + fmtDate(rsvpD) : ''}</p>
                ${rsvpC ? `<p class="inv-rsvp-value">${rsvpC}</p>` : ''}
              </div>` : ''}
            </div>
          </div>
        </div>`;
    }

    // ── Generate ──
    generateBtn.addEventListener('click', function () {
        const nameEl = document.getElementById('eventName');
        if (!nameEl.value.trim()) {
            nameEl.style.borderColor = '#ef4444';
            nameEl.focus();
            setTimeout(() => nameEl.style.borderColor = '', 2200);
            return;
        }

        placeholder.style.display = 'none';
        // Remove existing card
        const old = document.getElementById('invCard');
        if (old) old.closest('.inv-card-outer').remove();

        const div = document.createElement('div');
        div.innerHTML = buildInvitation();
        wrapper.appendChild(div.firstElementChild);

        actionRow.style.display = 'flex';
        launchConfetti();
        autoSave();
    });

    // ── Confetti ──
    function launchConfetti() {
        confettiCvs.width  = window.innerWidth;
        confettiCvs.height = window.innerHeight;
        confettiCvs.style.display = 'block';

        const palette = [accentColor, '#ff6b6b', '#ffd700', '#a855f7', '#00c8ff', '#ffffff'];
        const pieces  = Array.from({ length: 130 }, () => ({
            x:      Math.random() * confettiCvs.width,
            y:      -10 - Math.random() * 40,
            w:      5 + Math.random() * 6,
            h:      3 + Math.random() * 3,
            color:  palette[Math.floor(Math.random() * palette.length)],
            vy:     2.5 + Math.random() * 3,
            vx:     (Math.random() - .5) * 2.5,
            rot:    Math.random() * 360,
            rs:     (Math.random() - .5) * 7,
        }));

        let frame, tick = 0;
        function draw() {
            confettiCtx.clearRect(0, 0, confettiCvs.width, confettiCvs.height);
            pieces.forEach(p => {
                confettiCtx.save();
                confettiCtx.translate(p.x, p.y);
                confettiCtx.rotate(p.rot * Math.PI / 180);
                confettiCtx.globalAlpha = Math.max(0, 1 - tick / 100);
                confettiCtx.fillStyle = p.color;
                confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                confettiCtx.restore();
                p.x  += p.vx;
                p.y  += p.vy;
                p.rot += p.rs;
            });
            tick++;
            if (tick < 130) {
                frame = requestAnimationFrame(draw);
            } else {
                cancelAnimationFrame(frame);
                confettiCvs.style.display = 'none';
            }
        }
        draw();
    }

    // ── Download PNG ──
    document.getElementById('dlPNG').addEventListener('click', async function () {
        const card = document.getElementById('invCard');
        if (!card) return;
        try {
            const c = await html2canvas(card, { scale: 2, useCORS: true, backgroundColor: null });
            const a = document.createElement('a');
            a.download = 'birthday-invitation.png';
            a.href = c.toDataURL('image/png');
            a.click();
        } catch (e) {
            alert('Could not export image. Please try again.');
        }
    });

    // ── Download PDF ──
    document.getElementById('dlPDF').addEventListener('click', async function () {
        const card = document.getElementById('invCard');
        if (!card) return;
        try {
            const { jsPDF } = window.jspdf;
            const c = await html2canvas(card, { scale: 2, useCORS: true });
            const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            const w = 190;
            const h = (c.height * w) / c.width;
            pdf.addImage(c.toDataURL('image/png'), 'PNG', 10, 10, w, h);
            pdf.save('birthday-invitation.pdf');
        } catch (e) {
            alert('Could not export PDF. Please try again.');
        }
    });

    // ── Copy Link ──
    document.getElementById('copyLinkBtn').addEventListener('click', function () {
        navigator.clipboard.writeText(window.location.href).then(() => {
            this.innerHTML = '<i class="fas fa-check"></i> Copied!';
            setTimeout(() => { this.innerHTML = '<i class="fas fa-link"></i> Copy Link'; }, 2000);
        });
    });

    // ── WhatsApp Share ──
    document.getElementById('shareWA').addEventListener('click', function () {
        const name  = document.getElementById('eventName').value.trim();
        const date  = document.getElementById('eventDate').value;
        const venueV = document.getElementById('venue').value.trim();
        const parts = [
            `🎂 You're invited to *${name || 'a birthday party'}*!`,
            date  ? `📅 ${fmtDate(date)}` : '',
            venueV ? `📍 ${venueV}` : '',
            `\nCreate your own at: ${window.location.href}`,
        ].filter(Boolean);
        window.open(`https://wa.me/?text=${encodeURIComponent(parts.join('\n'))}`, '_blank');
    });

    // ── Auto-save ──
    const FIELDS = ['eventName', 'hostName', 'eventDate', 'eventTime', 'venue', 'message', 'rsvpContact', 'rsvpDate'];

    function autoSave() {
        const data = {};
        FIELDS.forEach(id => { data[id] = document.getElementById(id).value; });
        data.theme  = currentTheme;
        data.accent = accentColor;
        try { localStorage.setItem('bday_invite_v2', JSON.stringify(data)); } catch (_) {}
    }

    // ── Load saved ──
    try {
        const saved = JSON.parse(localStorage.getItem('bday_invite_v2') || '{}');
        FIELDS.forEach(id => {
            if (saved[id]) document.getElementById(id).value = saved[id];
        });
        if (saved.theme) {
            currentTheme = saved.theme;
            document.querySelectorAll('.theme-thumb').forEach(t => {
                t.classList.toggle('active', t.dataset.theme === currentTheme);
            });
        }
        if (saved.accent) {
            accentColor = saved.accent;
            document.querySelectorAll('.color-pill').forEach(p => {
                p.classList.toggle('active', p.dataset.color === accentColor);
            });
        }
    } catch (_) {}

    FIELDS.forEach(id => {
        document.getElementById(id).addEventListener('input', autoSave);
    });
})();
</script>
</body>
</html>
